  <!-- Global Error Handler: Displays errors in a clear red box instead of a blank white page -->
  <script>
    (function() {
      function showGlobalError(title, msg, stack) {
        var box = document.getElementById('global-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'global-error-box';
          box.style.cssText = 'position:fixed;top:12px;left:12px;right:12px;max-width:760px;margin:0 auto;z-index:999999;background:#fff1f2;border:2px solid #e11d48;color:#9f1239;padding:16px 20px;border-radius:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,0.25);line-height:1.5;';
          var h = document.createElement('h3');
          h.style.cssText = 'font-size:15px;font-weight:900;margin:0 0 8px 0;display:flex;align-items:center;gap:8px;color:#be123c;';
          h.innerHTML = '⚠️ Sayfa Yükleme / Çalışma Hatası';
          box.appendChild(h);
          var sub = document.createElement('p');
          sub.style.cssText = 'font-size:12px;margin:0 0 10px 0;color:#881337;font-weight:600;';
          sub.innerText = 'Uygulama çalışırken bir hata oluştu:';
          box.appendChild(sub);
          var pre = document.createElement('pre');
          pre.id = 'global-error-pre';
          pre.style.cssText = 'background:#ffe4e6;border:1px solid #fda4af;padding:10px 12px;border-radius:10px;font-size:11px;font-family:monospace;overflow-x:auto;white-space:pre-wrap;color:#9f1239;max-height:220px;';
          box.appendChild(pre);
          var btn = document.createElement('button');
          btn.style.cssText = 'margin-top:12px;padding:8px 16px;background:#e11d48;color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;';
          btn.innerText = 'Sayfayı Yeniden Yükle';
          btn.onclick = function() { window.location.reload(); };
          box.appendChild(btn);
          (document.body || document.documentElement).appendChild(box);
        }
        var p = document.getElementById('global-error-pre');
        if (p) {
          var text = (title ? '[' + title + '] ' : '') + msg;
          if (stack) text += '

' + stack;
          p.innerText = (p.innerText ? p.innerText + '
---
' : '') + text;
        }
      }
      window.addEventListener('error', function(e) {
        showGlobalError('Hata', (e.message || String(e)) + (e.filename ? ' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')' : ''), e.error ? e.error.stack : null);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        showGlobalError('Vaat Hatası', r ? (r.message || String(r)) : 'Bilinmeyen vaat reddi', r ? r.stack : null);
      });
    })();
  </script>

  <!-- Main Standalone Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- CRYPTO UTILITIES (Web Crypto API) ---
    const PBKDF2_ITERATIONS = 100000;
    const CANARY_STRING = 'SAKA_DEFTERI_OK';
    const SALT_KEY = 'saka_defteri_salt_v1';
    const VAULT_KEY = 'saka_defteri_vault_v1';
    const THEME_KEY = 'saka_defteri_theme';
    const PIN_LEN_KEY = 'saka_defteri_pin_len_v1';
    const LOCKOUT_KEY = 'saka_defteri_lockout_until';
    const FAILED_ATTEMPTS_KEY = 'saka_defteri_failed_attempts';
    const DEFAULT_PROJECTS = ['Sucum Nerede'];

    function bufferToBase64(buffer) {
      const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function base64ToBuffer(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function generateSalt() {
      const salt = new Uint8Array(16);
      window.crypto.getRandomValues(salt);
      return salt;
    }

    async function deriveKey(pin, salt) {
      const encoder = new TextEncoder();
      const pinBuffer = encoder.encode(pin);
      const baseKey = await window.crypto.subtle.importKey(
        'raw', pinBuffer, 'PBKDF2', false, ['deriveKey']
      );
      return await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: PBKDF2_ITERATIONS,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptAppData(data, key) {
      const encoder = new TextEncoder();
      const plaintext = encoder.encode(JSON.stringify(data));
      const iv = new Uint8Array(12);
      window.crypto.getRandomValues(iv);
      const encryptedBuffer = await window.crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        plaintext
      );
      return {
        iv: bufferToBase64(iv),
        ciphertext: bufferToBase64(encryptedBuffer)
      };
    }

    async function decryptAppData(encrypted, key) {
      const iv = base64ToBuffer(encrypted.iv);
      const ciphertext = base64ToBuffer(encrypted.ciphertext);
      const decryptedBuffer = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        ciphertext
      );
      const decoder = new TextDecoder();
      const jsonStr = decoder.decode(decryptedBuffer);
      const parsed = JSON.parse(jsonStr);
      if (parsed.canary !== CANARY_STRING) {
        throw new Error('Geçersiz veri doğrulama anahtarı');
      }
      return normalizeAppData(parsed);
    }

    // --- STORAGE HELPERS ---
    function hasStoredVault() {
      return !!(localStorage.getItem(SALT_KEY) && localStorage.getItem(VAULT_KEY));
    }
    function getStoredSalt() {
      const b64 = localStorage.getItem(SALT_KEY);
      return b64 ? base64ToBuffer(b64) : null;
    }
    function saveStoredSalt(salt) {
      localStorage.setItem(SALT_KEY, bufferToBase64(salt));
    }
    function getStoredVault() {
      const raw = localStorage.getItem(VAULT_KEY);
      return raw ? JSON.parse(raw) : null;
    }
    function saveStoredVault(vault) {
      localStorage.setItem(VAULT_KEY, JSON.stringify(vault));
    }
    function getFailedAttempts() {
      const val = localStorage.getItem(FAILED_ATTEMPTS_KEY);
      return val ? parseInt(val, 10) || 0 : 0;
    }
    function incrementFailedAttempts() {
      const cur = getFailedAttempts() + 1;
      localStorage.setItem(FAILED_ATTEMPTS_KEY, String(cur));
      return cur;
    }
    function resetFailedAttempts() {
      localStorage.removeItem(FAILED_ATTEMPTS_KEY);
      localStorage.removeItem(LOCKOUT_KEY);
    }
    function getLockoutRemainingSeconds() {
      const until = localStorage.getItem(LOCKOUT_KEY);
      if (!until) return 0;
      const diffMs = parseInt(until, 10) - Date.now();
      if (diffMs <= 0) {
        localStorage.removeItem(LOCKOUT_KEY);
        return 0;
      }
      return Math.ceil(diffMs / 1000);
    }
    function setLockout(sec = 30) {
      localStorage.setItem(LOCKOUT_KEY, String(Date.now() + sec * 1000));
    }
    function clearStoredVault() {
      localStorage.removeItem(SALT_KEY);
      localStorage.removeItem(VAULT_KEY);
      localStorage.removeItem(PIN_LEN_KEY);
      localStorage.removeItem(LOCKOUT_KEY);
      localStorage.removeItem(FAILED_ATTEMPTS_KEY);
    }

    // --- DATA NORMALIZATION & MIGRATION ---
    function normalizeAppData(data) {
      if (!data || typeof data !== 'object') {
        return createInitialAppData();
      }
      const projects = Array.isArray(data.projects) && data.projects.length > 0
        ? data.projects
        : [...DEFAULT_PROJECTS];

      const notes = Array.isArray(data.notes) ? [...data.notes] : [];
      const sakas = Array.isArray(data.sakas) ? data.sakas : [];

      for (const saka of sakas) {
        if (!saka.project) saka.project = 'Sucum Nerede';

        // Migrate legacy saka.notes to unified global notes
        if (Array.isArray(saka.notes) && saka.notes.length > 0) {
          for (const oldNote of saka.notes) {
            if (!oldNote || !oldNote.text) continue;
            const exists = notes.some(n => n.id === oldNote.id || (n.text === oldNote.text && n.targetCustomerIds?.includes(saka.id)));
            if (!exists) {
              notes.push({
                id: oldNote.id || 'migrated-' + Math.random().toString(36).slice(2, 7),
                date: oldNote.date || toLocalDateString(new Date()),
                createdAt: oldNote.createdAt || Date.now(),
                targetType: 'single',
                targetCustomerIds: [saka.id],
                targetCustomerNames: [saka.ownerName || ('#' + saka.sakaNo)],
                project: saka.project || 'Sucum Nerede',
                type: 'saka_istegi',
                text: oldNote.text,
                status: 'bekliyor'
              });
            }
          }
        }
      }

      // Migrate existing note types:
      // "Müşteri İsteği" -> "Saka isteği / öneri" (saka_istegi)
      // "Uygulama Eksiği/Hatası" -> "Yapılacak" (yapilacak)
      for (const n of notes) {
        if (n.type === 'musteri_istegi') {
          n.type = 'saka_istegi';
        } else if (n.type === 'uygulama_eksigi' || n.type === 'uygulama_hatasi') {
          n.type = 'yapilacak';
        } else if (!n.type) {
          n.type = 'kendi_notum';
        }
      }

      return {
        version: data.version || 1,
        canary: data.canary || CANARY_STRING,
        lastModified: data.lastModified || Date.now(),
        lastBackupDate: data.lastBackupDate || null,
        lastBackupSizeBytes: data.lastBackupSizeBytes,
        projects,
        notes,
        sakas
      };
    }

    function findNonSucumRecords(data) {
      const sakas = (data.sakas || []).filter(s => s.project && s.project !== 'Sucum Nerede');
      const notes = (data.notes || []).filter(n => n.project && n.project !== 'Sucum Nerede');
      return { sakas, notes };
    }

    // --- DATE & FINANCIAL HELPERS ---
    function toLocalDateString(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseLocalDate(str) {
      if (!str) return new Date();
      const p = str.split('-').map(Number);
      if (p.length < 3 || isNaN(p[0])) return new Date();
      return new Date(p[0], p[1] - 1, p[2], 0, 0, 0, 0);
    }

    function calculateSubscriptionEndDate(startDateStr, type) {
      const d = parseLocalDate(startDateStr || toLocalDateString(new Date()));
      if (type === 'trial') d.setDate(d.getDate() + 15);
      else if (type === '3month') d.setMonth(d.getMonth() + 3);
      else if (type === 'yearly') d.setFullYear(d.getFullYear() + 1);
      else if (type === 'custom') d.setMonth(d.getMonth() + 1);
      return toLocalDateString(d);
    }

    function getDaysRemaining(endDateStr) {
      if (!endDateStr) return 0;
      const end = parseLocalDate(endDateStr);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      return Math.round((end.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
    }

    function formatCurrency(amt) {
      return new Intl.NumberFormat('tr-TR', {
        style: 'currency',
        currency: 'TRY',
        maximumFractionDigits: 0
      }).format(amt || 0);
    }

    function formatDateTr(str) {
      if (!str) return '-';
      try {
        const p = str.split('-').map(Number);
        if (p.length < 3) return str;
        return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('tr-TR', {
          day: 'numeric', month: 'short', year: 'numeric'
        });
      } catch { return str; }
    }

    function formatDateTimeTr(str) {
      if (!str) return 'Hiç alınmadı';
      try {
        const d = new Date(str);
        if (isNaN(d.getTime())) return str;
        return d.toLocaleDateString('tr-TR', {
          day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch { return str; }
    }

    function formatShortTimeOnly(isoDate) {
      if (!isoDate) return '';
      try {
        const d = new Date(isoDate);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      } catch { return ''; }
    }

    function formatShortSyncTime(isoDate) {
      if (!isoDate) return 'Eşitlenmedi';
      try {
        const d = new Date(isoDate);
        if (isNaN(d.getTime())) return 'Eşitlenmedi';
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const timeStr = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        if (isToday) {
          return 'Eşitlendi: ' + timeStr;
        }
        const dayMonth = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
        return 'Eşitlendi: ' + dayMonth + ' ' + timeStr;
      } catch {
        return 'Eşitlenmedi';
      }
    }

    function formatBackupSize(bytes) {
      if (!bytes || bytes <= 0) return '0 KB';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function getSakaFinancials(saka) {
      const txs = saka.transactions || [];
      let totalUcret = 0, totalMasraf = 0, totalTahsilat = 0;
      for (const t of txs) {
        const a = Number(t.amount) || 0;
        if (t.type === 'ucret' || t.type === 'verdim') totalUcret += a;
        else if (t.type === 'masraf') totalMasraf += a;
        else if (t.type === 'tahsilat' || t.type === 'aldim') totalTahsilat += a;
      }
      const net = totalUcret + totalMasraf - totalTahsilat;
      let label = 'Hesap kapalı';
      if (net > 0) label = `Alacak: ${formatCurrency(net)}`;
      else if (net < 0) label = `Fazla ödeme: ${formatCurrency(Math.abs(net))}`;
      return { totalUcret, totalMasraf, totalTahsilat, netBalance: net, balanceLabel: label };
    }

    function getSakaStatus(saka) {
      const days = getDaysRemaining(saka.subscription.endDate);
      const fin = getSakaFinancials(saka);
      if (saka.subscription.type === 'trial') {
        return {
          status: 'denemede',
          label: 'Denemede',
          badgeClass: 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300 dark:border-amber-800'
        };
      }
      if (days <= 7) {
        return {
          status: 'bitiyor',
          label: days < 0 ? `Süresi Doldu (${Math.abs(days)}g)` : `Bitiyor (${days}g)`,
          badgeClass: 'bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 border-rose-300 dark:border-rose-800 animate-pulse'
        };
      }
      if (fin.netBalance > 0) {
        return {
          status: 'odeme_bekliyor',
          label: 'Ödeme Bekliyor',
          badgeClass: 'bg-orange-100 text-orange-800 dark:bg-orange-950/60 dark:text-orange-300 border-orange-300 dark:border-orange-800'
        };
      }
      return {
        status: 'aktif',
        label: 'Aktif',
        badgeClass: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-300 dark:border-emerald-800'
      };
    }

    function normalizeNoteType(type) {
      if (!type) return 'kendi_notum';
      if (type === 'saka_istegi' || type === 'musteri_istegi') return 'saka_istegi';
      if (type === 'yapilacak' || type === 'uygulama_eksigi' || type === 'uygulama_hatasi') return 'yapilacak';
      if (type === 'yapilmayacak_dikkat' || type === 'yapilmayacak' || type === 'dikkat') return 'yapilmayacak_dikkat';
      return 'kendi_notum';
    }

    function getNoteTypeLabel(type) {
      const norm = normalizeNoteType(type);
      if (norm === 'yapilacak') return 'Yapılacak';
      if (norm === 'yapilmayacak_dikkat') return 'Yapılmayacak / Dikkat';
      if (norm === 'saka_istegi') return 'Saka isteği / öneri';
      return 'Kendi notum';
    }

    function getNoteStatusLabel(status) {
      if (status === 'bekliyor') return 'Bekliyor';
      if (status === 'yapiliyor') return 'Yapılıyor';
      if (status === 'yapildi') return 'Tamamlandı';
      return 'Yapılmayacak';
    }

    function getNoteStatusColor(status) {
      if (status === 'bekliyor') return 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 border-amber-300';
      if (status === 'yapiliyor') return 'bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300 border-sky-300';
      if (status === 'yapildi') return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border-emerald-300';
      return 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-300';
    }

    function checkSevenDayBackupReminder(lastBackupDate, hasRealData) {
      if (!hasRealData) return { shouldShow: false, daysAgo: 0 };
      if (!lastBackupDate) return { shouldShow: true, daysAgo: 7 };
      const last = new Date(lastBackupDate).getTime();
      if (isNaN(last)) return { shouldShow: true, daysAgo: 7 };
      const days = Math.floor((Date.now() - last) / (24 * 60 * 60 * 1000));
      return { shouldShow: days >= 7, daysAgo: Math.max(1, days) };
    }

    function isSampleSaka(saka) {
      return saka.isSample === true || saka.id === 'saka-38' || saka.id === 'saka-99' || saka.id === 'saka-14';
    }

    function createInitialAppData() {
      return {
        version: 1,
        canary: CANARY_STRING,
        lastModified: Date.now(),
        lastBackupDate: null,
        projects: [...DEFAULT_PROJECTS],
        notes: [],
        sakas: []
      };
    }

    function createSampleAppData() {
      const today = toLocalDateString(new Date());
      const addDays = (n) => {
        const d = new Date();
        d.setDate(d.getDate() + n);
        return toLocalDateString(d);
      };
      return {
        version: 1,
        canary: CANARY_STRING,
        lastModified: Date.now(),
        lastBackupDate: null,
        projects: [...DEFAULT_PROJECTS],
        notes: [
          {
            id: 'note-sample-1',
            date: today,
            createdAt: Date.now() - 3600000,
            targetType: 'single',
            targetCustomerIds: ['saka-38'],
            targetCustomerNames: ['Ahmet Karadeniz (#38)'],
            project: 'Sucum Nerede',
            type: 'saka_istegi',
            text: 'Moda sokakları dar olduğu için navigasyona ters yön uyarıları eklensin.',
            status: 'yapiliyor'
          },
          {
            id: 'note-sample-2',
            date: today,
            createdAt: Date.now() - 7200000,
            targetType: 'all',
            targetCustomerIds: [],
            targetCustomerNames: ['Genel'],
            project: 'Sucum Nerede',
            type: 'yapilacak',
            text: 'Abonelik bitişine 3 gün kala WhatsApp üzerinden otomatik hatırlatma mesajı gönderme özelliği yapılacak.',
            status: 'bekliyor'
          },
          {
            id: 'note-sample-3',
            date: today,
            createdAt: Date.now() - 10000000,
            targetType: 'all',
            targetCustomerIds: [],
            targetCustomerNames: ['Benim Notum'],
            project: 'Sucum Nerede',
            type: 'yapilmayacak_dikkat',
            text: 'Pazar günleri dağıtım yapılmıyor, acil sipariş olsa bile şoför aranmayacak.',
            status: 'bekliyor'
          }
        ],
        sakas: [
          {
            id: 'saka-38',
            sakaNo: 38,
            project: 'Sucum Nerede',
            ownerName: 'Ahmet Karadeniz',
            ownerPhone: '0532 555 3838',
            driverName: 'Mustafa Yıldız',
            driverPhone: '0542 444 3801',
            employeeName: 'Serkan Ay',
            employeePhone: '0555 333 3802',

    // --- GOOGLE DRIVE SYNC HELPERS (GIS + REST) ---
    const GOOGLE_CLIENT_ID = '992957090649-ci2utsq7efu5bdp2lbft46e09ksrb11r.apps.googleusercontent.com';
    let cachedGisToken = sessionStorage.getItem('saka_defteri_drive_token') || localStorage.getItem('saka_defteri_drive_token') || null;

    function getDeviceName() {
      const saved = localStorage.getItem('saka_defteri_device_name');
      if (saved && saved.trim()) return saved.trim();
      const ua = navigator.userAgent || '';
      const isMobile = /Android|iPhone|iPad|iPod/i.test(ua);
      const isTablet = /iPad/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua)) || (isMobile && window.innerWidth >= 768);
      let d = 'Cihaz';
      if (/iPad/i.test(ua)) d = 'Tablet (iPad)';
      else if (/iPhone/i.test(ua)) d = 'Telefon (iPhone)';
      else if (/Android/i.test(ua)) d = isTablet ? 'Tablet (Android)' : 'Telefon (Android)';
      else if (/Macintosh/i.test(ua)) d = 'Masaüstü (Mac)';
      else if (/Windows/i.test(ua)) d = 'Masaüstü (Windows)';
      else if (isTablet) d = 'Tablet';
      else if (isMobile) d = 'Telefon';
      localStorage.setItem('saka_defteri_device_name', d);
      return d;
    }

    function requestDriveToken(interactive = false) {
      return new Promise((resolve, reject) => {
        if (cachedGisToken && !interactive) {
          resolve(cachedGisToken);
          return;
        }
        if (typeof window.google === 'undefined' || !window.google.accounts || !window.google.accounts.oauth2) {
          reject(new Error('Google Giriş kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edin.'));
          return;
        }
        const client = window.google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (resp) => {
            if (resp.error) {
              reject(new Error(resp.error_description || resp.error));
            } else {
              cachedGisToken = resp.access_token;
              sessionStorage.setItem('saka_defteri_drive_token', resp.access_token);
              localStorage.setItem('saka_defteri_drive_token', resp.access_token);
              localStorage.setItem('saka_defteri_drive_connected', 'true');
              resolve(cachedGisToken);
            }
          }
        });
        client.requestAccessToken({ prompt: interactive ? 'consent' : '' });
      });
    }

    async function findDriveSyncFile(token) {
      const q = encodeURIComponent("name = 'saka-defteri-sync.json' and trashed = false");
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 401) {
        cachedGisToken = null;
        sessionStorage.removeItem('saka_defteri_drive_token');
        localStorage.removeItem('saka_defteri_drive_token');
        throw new Error('OTURUM_ZAMAN_ASIMI');
      }
      const data = await res.json();
      return data.files && data.files.length > 0 ? data.files[0] : null;
    }

    async function fetchDriveSyncPayload(token) {
      const file = await findDriveSyncFile(token);
      if (!file) return null;
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Drive dosyası indirilemedi.');
      return await res.json();
    }

    async function uploadAppDataToDrive(data, key, saltBuffer) {
      const token = await requestDriveToken();
      const enc = await encryptAppData(data, key);
      const devName = getDeviceName();
      const nowIso = new Date().toISOString();
      const payload = {
        format: 'saka-defteri-sync',
        version: 1,
        salt: bufferToBase64(saltBuffer),
        vault: enc,
        exportedAt: nowIso,
        lastModified: data.lastModified || Date.now(),
        deviceInfo: { name: devName },
        sakaCount: (data.sakas || []).length,
        noteCount: (data.notes || []).length
      };
      const jsonStr = JSON.stringify(payload, null, 2);
      const existing = await findDriveSyncFile(token);

      if (existing) {
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json; charset=UTF-8'
          },
          body: jsonStr
        });
      } else {
        const boundary = '-------SakaBoundary' + Math.random().toString(36).slice(2);
        const delimiter = `\r\n--${boundary}\r\n`;
        const closeDelimiter = `\r\n--${boundary}--`;
        const metadata = { name: 'saka-defteri-sync.json', mimeType: 'application/json' };
        const body = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + jsonStr + closeDelimiter;
        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body
        });
      }
      localStorage.setItem('saka_defteri_last_sync_date', nowIso);
      localStorage.setItem('saka_defteri_last_sync_device', devName);
      return payload;
    }

    // --- MAIN COMPONENT ---
    function App() {
      const PIN_LENGTH = 6;
      const [isDark, setIsDark] = useState(() => localStorage.getItem(THEME_KEY) === 'dark');
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [isFirstSetup, setIsFirstSetup] = useState(!hasStoredVault());
      const [setupFirstEnteredPin, setSetupFirstEnteredPin] = useState('');
      const [isConfirmingSetup, setIsConfirmingSetup] = useState(false);
      const [enteredPin, setEnteredPin] = useState('');
      const [activePin, setActivePin] = useState('');
      const [pinError, setPinError] = useState('');
      const [isShaking, setIsShaking] = useState(false);
      const [lockoutSec, setLockoutSec] = useState(getLockoutRemainingSeconds);

      // Decrypted vault in memory
      const [appData, setAppData] = useState(null);
      const activeKeyRef = useRef(null);

      // UI States
      const [activeFilter, setActiveFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSaka, setSelectedSaka] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const fileInputRef = useRef(null);

      // 7-day reminder modal
      const [sevenDayReminder, setSevenDayReminder] = useState({ isOpen: false, daysAgo: 0 });

      // Note modal
      const [isNoteModalOpen, setIsNoteModalOpen] = useState(false);
      const [editingNote, setEditingNote] = useState(null);
      const [noteDefaultCustomerId, setNoteDefaultCustomerId] = useState(undefined);

      // Legacy project conflict modal (Kuaför, Servis)
      const [legacyConflict, setLegacyConflict] = useState(null);

      // Google Drive states
      const [isDriveConnected, setIsDriveConnected] = useState(() => localStorage.getItem('saka_defteri_drive_connected') === 'true');
      const [isDriveSyncing, setIsDriveSyncing] = useState(false);
      const [lastSyncDate, setLastSyncDate] = useState(() => localStorage.getItem('saka_defteri_last_sync_date'));
      const [lastSyncDevice, setLastSyncDevice] = useState(() => localStorage.getItem('saka_defteri_last_sync_device'));
      const [deviceName, setDeviceNameState] = useState(getDeviceName);
      const [drivePullModalData, setDrivePullModalData] = useState({ isOpen: false, payload: null, isAutoPrompt: false });
      const [hasNewerOnDrive, setHasNewerOnDrive] = useState(false);
      const [isDriveMenuOpen, setIsDriveMenuOpen] = useState(false);
      const [autoLockSetting, setAutoLockSetting] = useState(() => localStorage.getItem('saka_defteri_autolock_setting') || '5m');

      const getAutoLockDurationMs = (setting) => {
        switch (setting) {
          case 'immediate': return 0;
          case '1m': return 60 * 1000;
          case '5m': return 5 * 60 * 1000;
          case '15m': return 15 * 60 * 1000;
          default: return 5 * 60 * 1000;
        }
      };

      const handleAutoLockSettingChange = (newSetting) => {
        setAutoLockSetting(newSetting);
        localStorage.setItem('saka_defteri_autolock_setting', newSetting);
      };

      // Theme toggle
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          localStorage.setItem(THEME_KEY, 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem(THEME_KEY, 'light');
        }
      }, [isDark]);

      // Lockout countdown timer
      useEffect(() => {
        if (lockoutSec <= 0) return;
        const t = setInterval(() => {
          const rem = getLockoutRemainingSeconds();
          setLockoutSec(rem);
          if (rem <= 0) clearInterval(t);
        }, 1000);
        return () => clearInterval(t);
      }, [lockoutSec]);

      // Toast helper
      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Auto-unlock from session on page load if within timeout
      useEffect(() => {
        const savedSessionPin = sessionStorage.getItem('saka_defteri_session_pin');
        const lastActiveStr = localStorage.getItem('saka_defteri_last_active_time');
        if (savedSessionPin && lastActiveStr) {
          const elapsed = Date.now() - parseInt(lastActiveStr, 10);
          const timeout = getAutoLockDurationMs(autoLockSetting);
          if (timeout > 0 && elapsed < timeout) {
            executePinCheck(savedSessionPin);
          } else if (timeout === 0) {
            sessionStorage.removeItem('saka_defteri_session_pin');
          }
        }
      }, []);

      // Visibility change and background auto-lock timer
      useEffect(() => {
        if (!isUnlocked) return;

        const handleActivity = () => {
          localStorage.setItem('saka_defteri_last_active_time', String(Date.now()));
        };

        const handleVisibilityChange = () => {
          if (document.hidden) {
            localStorage.setItem('saka_defteri_last_active_time', String(Date.now()));
          } else {
            const lastActiveStr = localStorage.getItem('saka_defteri_last_active_time');
            if (lastActiveStr) {
              const elapsed = Date.now() - parseInt(lastActiveStr, 10);
              const timeout = getAutoLockDurationMs(autoLockSetting);
              if (timeout === 0 || elapsed >= timeout) {
                sessionStorage.removeItem('saka_defteri_session_pin');
                setIsUnlocked(false);
                setEnteredPin('');
                showToast('Oturum süresi doldu, lütfen PIN girin.', 'info');
              } else {
                localStorage.setItem('saka_defteri_last_active_time', String(Date.now()));
              }
            }
          }
        };

        window.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('pointerdown', handleActivity, { passive: true });
        window.addEventListener('keydown', handleActivity, { passive: true });

        return () => {
          window.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('pointerdown', handleActivity);
          window.removeEventListener('keydown', handleActivity);
        };
      }, [isUnlocked, autoLockSetting]);

      // Auto-check PIN on 6th digit
      useEffect(() => {
        if (isUnlocked || lockoutSec > 0) return;
        if (enteredPin.length === PIN_LENGTH) {
          executePinCheck(enteredPin);
        }
      }, [enteredPin, isUnlocked, lockoutSec]);

      // Shake animation trigger
      const triggerShake = (errText) => {
        setPinError(errText);
        setIsShaking(true);
        setTimeout(() => {
          setIsShaking(false);
          setEnteredPin('');
        }, 400);
      };

      // PIN Verification or 2-Step Setup
      const executePinCheck = async (pinToCheck) => {
        if (isFirstSetup) {
          if (!isConfirmingSetup) {
            setSetupFirstEnteredPin(pinToCheck);
            setIsConfirmingSetup(true);
            setEnteredPin('');
            setPinError('');
            return;
          } else {
            if (pinToCheck !== setupFirstEnteredPin) {
              triggerShake('PIN kodları eşleşmedi! Tekrar deneyin.');
              setIsConfirmingSetup(false);
              setSetupFirstEnteredPin('');
              return;
            }
            try {
              const salt = generateSalt();
              const key = await deriveKey(pinToCheck, salt);
              const initial = createSampleAppData();
              const encrypted = await encryptAppData(initial, key);

              saveStoredSalt(salt);
              saveStoredVault(encrypted);
              activeKeyRef.current = key;
              setActivePin(pinToCheck);
              sessionStorage.setItem('saka_defteri_session_pin', pinToCheck);
              localStorage.setItem('saka_defteri_last_active_time', String(Date.now()));
              setAppData(initial);
              setIsUnlocked(true);
              setIsFirstSetup(false);
              resetFailedAttempts();
              showToast('6 haneli PIN kodunuz oluşturuldu!', 'success');
            } catch (e) {
              triggerShake('Şifreleme hatası.');
            }
            return;
          }
        }

        // Existing Vault Verification
        try {
          const salt = getStoredSalt();
          const vault = getStoredVault();
          if (!salt || !vault) {
            setIsFirstSetup(true);
            return;
          }
          const key = await deriveKey(pinToCheck, salt);
          const decrypted = await decryptAppData(vault, key);

          activeKeyRef.current = key;
          setActivePin(pinToCheck);
          sessionStorage.setItem('saka_defteri_session_pin', pinToCheck);
          localStorage.setItem('saka_defteri_last_active_time', String(Date.now()));
          setAppData(decrypted);
          setIsUnlocked(true);
          resetFailedAttempts();
          setPinError('');
          showToast('Kilit açıldı.', 'success');

          // Check 7-day reminder (only on real data)
          const hasReal = decrypted.sakas.some(s => !isSampleSaka(s));
          const check = checkSevenDayBackupReminder(decrypted.lastBackupDate, hasReal);
          if (check.shouldShow) {
            setSevenDayReminder({ isOpen: true, daysAgo: check.daysAgo });
          }

          // Check for non-Sucum Nerede legacy records (Kuaför, Servis)
          const nonSucum = findNonSucumRecords(decrypted);
          if (nonSucum.sakas.length > 0 || nonSucum.notes.length > 0) {
            setLegacyConflict(nonSucum);
          }

          // Check if Google Drive has newer records
          if (localStorage.getItem('saka_defteri_drive_connected') === 'true') {
            requestDriveToken(false).then(async (token) => {
              if (!token) return;
              try {
                const payload = await fetchDriveSyncPayload(token);
                if (payload && payload.exportedAt) {
                  const driveTime = new Date(payload.exportedAt).getTime();
                  const localTime = decrypted.lastModified || (decrypted.lastBackupDate ? new Date(decrypted.lastBackupDate).getTime() : 0);
                  if (driveTime > localTime + 30000) {
                    setHasNewerOnDrive(true);
                    setDrivePullModalData({ isOpen: true, payload, isAutoPrompt: true });
                  }
                }
              } catch (e) {}
            }).catch(() => {});
          }
        } catch (err) {
          const attempts = incrementFailedAttempts();
          if (attempts >= 5) {
            setLockout(30);
            setLockoutSec(30);
            resetFailedAttempts();
            triggerShake('5 yanlış deneme! 30 saniye kilitlendi.');
          } else {
            triggerShake('PIN yanlış, tekrar dene');
          }
        }
      };

      const handleKeypadPress = (val) => {
        if (lockoutSec > 0) return;
        setPinError('');
        if (val === 'C') {
          setEnteredPin('');
          if (isFirstSetup && isConfirmingSetup) {
            setIsConfirmingSetup(false);
            setSetupFirstEnteredPin('');
          }
        } else if (val === 'DEL') {
          setEnteredPin(prev => prev.slice(0, -1));
        } else {
          if (enteredPin.length < PIN_LENGTH) {
            setEnteredPin(prev => prev + val);
          }
        }
      };

      // Save AppData to Vault
      const saveAppData = async (updated) => {
        if (!activeKeyRef.current) return;
        try {
          const normalized = normalizeAppData(updated);
          const encrypted = await encryptAppData(normalized, activeKeyRef.current);
          saveStoredVault(encrypted);
          setAppData(normalized);
        } catch (err) {
          showToast('Kaydetme hatası!', 'error');
        }
      };

      // Quick Encrypted Backup with Web Share
      const handleQuickBackup = async () => {
        if (!appData || !activeKeyRef.current) return;
        try {
          const salt = getStoredSalt();
          if (!salt) return;
          const nowIso = new Date().toISOString();
          const preliminaryData = { ...appData, lastBackupDate: nowIso };
          const preliminaryEnc = await encryptAppData(preliminaryData, activeKeyRef.current);

          const payload = {
            format: 'saka-defteri-backup',
            version: 1,
            exportedAt: nowIso,
            salt: bufferToBase64(salt),
            vault: preliminaryEnc
          };
          const jsonStr = JSON.stringify(payload, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/octet-stream' });
          const sizeBytes = blob.size;

          const now = new Date();
          const fn = `saka-defteri-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.saka`;

          // Standard download
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fn;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);

          // Update vault with exact size
          const finalData = { ...preliminaryData, lastBackupSizeBytes: sizeBytes };
          const finalEnc = await encryptAppData(finalData, activeKeyRef.current);
          saveStoredVault(finalEnc);
          setAppData(finalData);
          setSevenDayReminder({ isOpen: false, daysAgo: 0 });

          // Web Share if available
          let shared = false;
          try {
            const file = new File([blob], fn, { type: 'application/octet-stream' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'Saka Defteri Şifreli Yedek',
                text: `Saka Defteri yedek dosyası (${formatBackupSize(sizeBytes)})`,
                files: [file]
              });
              shared = true;
            }
          } catch (e) {}

          showToast(shared ? `Yedek alındı ve paylaşıldı: ${fn}` : `Yedek indirildi: ${fn}`, 'success');
        } catch (e) {
          showToast('Yedek alınamadı.', 'error');
        }
      };

      // Restore Backup file
      const handleFileSelected = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          if (!json.salt || !json.vault) throw new Error('Geçersiz format');

          const salt = base64ToBuffer(json.salt);
          const vault = json.vault;

          if (activePin) {
            const testKey = await deriveKey(activePin, salt);
            try {
              const decrypted = await decryptAppData(vault, testKey);
              saveStoredSalt(salt);
              saveStoredVault(vault);
              activeKeyRef.current = testKey;
              setAppData(decrypted);
              setSevenDayReminder({ isOpen: false, daysAgo: 0 });
              showToast('Yedek başarıyla geri yüklendi!', 'success');
              e.target.value = '';
              return;
            } catch (e) {}
          }

          const promptPin = prompt('Yedek dosyasının 6 haneli PIN kodunu girin:');
          if (!promptPin || promptPin.length !== 6) {
            showToast('Yedek yükleme iptal edildi.', 'info');
            e.target.value = '';
            return;
          }
          const promptKey = await deriveKey(promptPin, salt);
          const decrypted = await decryptAppData(vault, promptKey);
          saveStoredSalt(salt);
          saveStoredVault(vault);
          activeKeyRef.current = promptKey;
          setActivePin(promptPin);
          setAppData(decrypted);
          setIsUnlocked(true);
          setSevenDayReminder({ isOpen: false, daysAgo: 0 });
          showToast('Yedek başarıyla açıldı ve yüklendi!', 'success');
        } catch (err) {
          showToast('Yedek dosyası açılamadı! PIN yanlış olabilir.', 'error');
        }
        e.target.value = '';
      };

      // Global Notes handlers
      const handleSaveNote = (note) => {
        const existingIdx = (appData.notes || []).findIndex(n => n.id === note.id);
        let updatedNotes;
        if (existingIdx >= 0) {
          updatedNotes = [...(appData.notes || [])];
          updatedNotes[existingIdx] = note;
        } else {
          updatedNotes = [note, ...(appData.notes || [])];
        }
        saveAppData({ ...appData, notes: updatedNotes });
        showToast('Not kaydedildi!', 'success');
      };

      const handleStatusChangeNote = (noteId, newStatus) => {
        const updatedNotes = (appData.notes || []).map(n => n.id === noteId ? { ...n, status: newStatus } : n);
        saveAppData({ ...appData, notes: updatedNotes });
        showToast('Not durumu güncellendi.', 'info');
      };

      const handleDeleteNote = (noteId) => {
        const updatedNotes = (appData.notes || []).filter(n => n.id !== noteId);
        saveAppData({ ...appData, notes: updatedNotes });
        showToast('Not silindi.', 'info');
      };

      const handleMigrateLegacyRecords = () => {
        if (!appData) return;
        const updatedSakas = appData.sakas.map(s => ({ ...s, project: 'Sucum Nerede' }));
        const updatedNotes = (appData.notes || []).map(n => ({ ...n, project: 'Sucum Nerede' }));
        saveAppData({ ...appData, sakas: updatedSakas, notes: updatedNotes });
        setLegacyConflict(null);
        showToast('Eski kayıtlar Sucum Nerede sakası olarak korundu.', 'success');
      };

      const handleDeleteLegacyRecords = () => {
        if (!appData || !legacyConflict) return;
        const removeSakaIds = new Set(legacyConflict.sakas.map(s => s.id));
        const removeNoteIds = new Set(legacyConflict.notes.map(n => n.id));
        const remainingSakas = appData.sakas.filter(s => !removeSakaIds.has(s.id));
        const remainingNotes = (appData.notes || []).filter(n => !removeNoteIds.has(n.id));
        saveAppData({ ...appData, sakas: remainingSakas, notes: remainingNotes });
        setLegacyConflict(null);
        showToast('Eski projelere ait kayıtlar silindi.', 'info');
      };

      // Google Drive Handlers
      const handleConnectDrive = async () => {
        try {
          setIsDriveSyncing(true);
          const token = await requestDriveToken(true);
          setIsDriveConnected(true);
          localStorage.setItem('saka_defteri_drive_connected', 'true');
          showToast('Google Drive bağlantısı başarılı!', 'success');

          const payload = await fetchDriveSyncPayload(token);
          if (payload) {
            setDrivePullModalData({ isOpen: true, payload, isAutoPrompt: true });
          }
        } catch (err) {
          showToast('Google Drive bağlantısı kurulamadı: ' + (err.message || 'Hata'), 'error');
        } finally {
          setIsDriveSyncing(false);
        }
      };

      const handleDisconnectDrive = () => {
        setIsDriveConnected(false);
        localStorage.removeItem('saka_defteri_drive_connected');
        cachedGisToken = null;
        showToast('Google Drive bağlantısı kesildi.', 'info');
      };

      const handleUpdateDeviceName = (name) => {
        setDeviceNameState(name);
        localStorage.setItem('saka_defteri_device_name', name);
        showToast('Cihaz adı kaydedildi.', 'success');
      };

      const handleDrivePush = async () => {
        if (!appData || !activePin || !activeKeyRef.current) return;
        setIsDriveSyncing(true);
        try {
          const salt = getStoredSalt();
          if (!salt) throw new Error('Şifreleme anahtarı bulunamadı.');
          const payload = await uploadAppDataToDrive(appData, activeKeyRef.current, salt);
          setLastSyncDate(payload.exportedAt);
          setLastSyncDevice(deviceName);
          setHasNewerOnDrive(false);
          showToast("Kayıtlar PIN ile şifrelenerek Google Drive'a yüklendi!", 'success');
        } catch (err) {
          if (err.message === 'OTURUM_ZAMAN_ASIMI') {
            try {
              const token = await requestDriveToken(true);
              const salt = getStoredSalt();
              const payload = await uploadAppDataToDrive(appData, activeKeyRef.current, salt);
              setLastSyncDate(payload.exportedAt);
              setLastSyncDevice(deviceName);
              setHasNewerOnDrive(false);
              showToast("Kayıtlar PIN ile şifrelenerek Google Drive'a yüklendi!", 'success');
              return;
            } catch (e) {
              showToast('Drive oturum yenileme başarısız oldu.', 'error');
              return;
            }
          }
          showToast("Drive'a gönderme hatası: " + (err.message || ''), 'error');
        } finally {
          setIsDriveSyncing(false);
        }
      };

      const handleDrivePull = async () => {
        setIsDriveSyncing(true);
        try {
          let token;
          try {
            token = await requestDriveToken(false);
          } catch {
            token = await requestDriveToken(true);
          }
          const payload = await fetchDriveSyncPayload(token);
          if (!payload) {
            showToast("Google Drive'da henüz kayıt bulunamadı. Önce diğer cihazdan gönderin.", 'info');
            return;
          }
          setDrivePullModalData({ isOpen: true, payload, isAutoPrompt: false });
        } catch (err) {
          showToast("Drive'dan alma hatası: " + (err.message || ''), 'error');
        } finally {
          setIsDriveSyncing(false);
        }
      };

      const handleConfirmDrivePull = async (payload, altPin) => {
        try {
          const pinToUse = (altPin && altPin.length === 6) ? altPin : activePin;
          const salt = base64ToBuffer(payload.salt);
          const key = await deriveKey(pinToUse, salt);
          const decrypted = await decryptAppData(payload.vault, key);

          saveStoredSalt(salt);
          saveStoredVault(payload.vault);
          activeKeyRef.current = key;
          setActivePin(pinToUse);
          setAppData(decrypted);

          setLastSyncDate(payload.exportedAt);
          setLastSyncDevice(payload.deviceInfo?.name || 'Diğer Cihaz');
          localStorage.setItem('saka_defteri_last_sync_date', payload.exportedAt);
          if (payload.deviceInfo?.name) {
            localStorage.setItem('saka_defteri_last_sync_device', payload.deviceInfo.name);
          }

          setHasNewerOnDrive(false);
          setDrivePullModalData({ isOpen: false, payload: null, isAutoPrompt: false });
          showToast("Kayıtlar Google Drive'dan başarıyla alındı ve güncellendi!", 'success');
        } catch (err) {
          showToast('Drive kaydı açılamadı! PIN kodu bu dosyanın şifresiyle uyuşmuyor.', 'error');
        }
      };

      // Filtered & Sorted Sakas
      const sortedAndFilteredSakas = useMemo(() => {
        if (!appData) return [];
        let list = [...appData.sakas].sort((a, b) => (Number(a.sakaNo) || 0) - (Number(b.sakaNo) || 0));

        // Status filter
        if (activeFilter !== 'all') {
          list = list.filter(s => {
            const days = getDaysRemaining(s.subscription.endDate);
            const fin = getSakaFinancials(s);
            if (activeFilter === 'denemede') return s.subscription.type === 'trial';
            if (activeFilter === 'odeme_bekliyor') return fin.netBalance > 0;
            if (activeFilter === 'bitiyor') return days <= 7;
            if (activeFilter === 'aktif') return s.subscription.type !== 'trial' && days > 7 && fin.netBalance <= 0;
            return true;
          });
        }

        // Search query
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter(s => {
            const sno = String(s.sakaNo);
            const name = (s.ownerName || '').toLowerCase();
            const plate = (s.vehiclePlate || '').toLowerCase();
            const model = (s.vehicleModel || '').toLowerCase();
            const proj = (s.project || 'Sucum Nerede').toLowerCase();
            const phone = (s.ownerPhone || '').replace(/\s+/g, '');
            const driver = (s.driverName || '').toLowerCase();
            return sno.includes(q) || name.includes(q) || plate.includes(q) || model.includes(q) || proj.includes(q) || phone.includes(q) || driver.includes(q);
          });
        }
        return list;
      }, [appData, activeFilter, searchQuery]);

      // Metrics calculation
      const metrics = useMemo(() => {
        if (!appData) return { total: 0, trial: 0, totalReceivable: 0, expiringThisWeek: 0 };
        let trial = 0, totalReceivable = 0, expiringThisWeek = 0;
        for (const s of appData.sakas) {
          if (s.subscription.type === 'trial') trial++;
          const fin = getSakaFinancials(s);
          if (fin.netBalance > 0) totalReceivable += fin.netBalance;
          const days = getDaysRemaining(s.subscription.endDate);
          if (days >= 0 && days <= 7) expiringThisWeek++;
        }
        return { total: appData.sakas.length, trial, totalReceivable, expiringThisWeek };
      }, [appData]);

      // --- RENDER PIN LOCK SCREEN ---
      if (!isUnlocked) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-b from-slate-900 via-slate-900 to-sky-950 text-white select-none">
            <div className="flex flex-col items-center mb-6">
              <div className="w-16 h-16 rounded-2xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-400 mb-3 shadow-lg shadow-sky-500/10">
                <IconDroplet className="w-10 h-10" />
              </div>
              <h1 className="text-2xl font-black tracking-tight text-white">Saka Defteri</h1>
              <p className="text-xs text-slate-400 mt-1 font-medium">
                {isFirstSetup
                  ? (isConfirmingSetup ? 'PIN Kodunu Onaylayın (Tekrar 6 Hane)' : '6 Haneli PIN Belirleyin')
                  : '6 Haneli PIN Kodunuzu Girin'}
              </p>
            </div>

            {/* PIN Dots */}
            <div className={`flex items-center gap-3.5 my-4 p-3 ${isShaking ? 'animate-shake' : ''}`}>
              {Array.from({ length: PIN_LENGTH }).map((_, idx) => {
                const isFilled = idx < enteredPin.length;
                return (
                  <div
                    key={idx}
                    className={`w-4 h-4 rounded-full transition-all duration-200 ${
                      isFilled

    // --- PENDING NOTES PANEL ---
    function PendingNotesPanel({ notes, sakas, onAddNoteClick, onEditNote, onDeleteNote, onStatusChange, showToast }) {
      const [isExpanded, setIsExpanded] = useState(false);
      const [filterType, setFilterType] = useState('all');
      const [filterCust, setFilterCust] = useState('all');
      const [viewScope, setViewScope] = useState('pending');
      const [copied, setCopied] = useState(false);
      const [activeAudioId, setActiveAudioId] = useState(null);
      const audioRef = useRef(null);

      const filtered = useMemo(() => {
        let res = [...notes];
        if (viewScope === 'pending') {
          res = res.filter(n => n.status === 'bekliyor' || n.status === 'yapiliyor');
        }
        if (filterType !== 'all') res = res.filter(n => normalizeNoteType(n.type) === filterType);
        if (filterCust !== 'all') {
          if (filterCust === 'general') res = res.filter(n => n.targetType === 'all' || !n.targetCustomerIds?.length);
          else res = res.filter(n => n.targetCustomerIds?.includes(filterCust));
        }
        res.sort((a, b) => b.createdAt - a.createdAt);
        return res;
      }, [notes, viewScope, filterType, filterCust]);

      const pendingCount = useMemo(() => {
        return notes.filter(n => n.status === 'bekliyor' || n.status === 'yapiliyor').length;
      }, [notes]);

      const handleCopyAll = async () => {
        if (filtered.length === 0) {
          showToast('Kopyalanacak not bulunamadı.', 'info');
          return;
        }
        const lines = filtered.map((n, idx) => {
          let targetStr = 'Genel';
          if (n.targetType !== 'all' && n.targetCustomerIds?.length) {
            targetStr = n.targetCustomerIds.map(cid => {
              const s = sakas.find(item => item.id === cid);
              return s ? `${s.ownerName} (#${s.sakaNo})` : cid;
            }).join(', ');
          }
          const tLabel = getNoteTypeLabel(n.type);
          const sLabel = getNoteStatusLabel(n.status);
          const voiceTag = n.audioBase64 ? ' [sesli not var]' : '';
          const text = n.text || '(Sadece ses kaydı)';
          return `${idx + 1}. [${n.date}] Kime: ${targetStr} | Tür: ${tLabel} | Durum: ${sLabel}\n   Not: ${text}${voiceTag}`;
        });
        const header = `📋 SAKA DEFTERİ - NOTLAR & İSTEKLER (${filtered.length} Kayıt)\n----------------------------------------\n`;
        const full = header + lines.join('\n\n');

        try {
          await navigator.clipboard.writeText(full);
          setCopied(true);
          showToast(`${filtered.length} not panoya kopyalandı!`, 'success');
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          showToast('Kopyalama başarısız oldu.', 'error');
        }
      };

      const toggleAudio = (note) => {
        if (!note.audioBase64) return;
        if (activeAudioId === note.id) {
          if (audioRef.current) audioRef.current.pause();
          setActiveAudioId(null);
        } else {
          if (audioRef.current) audioRef.current.pause();
          const a = new Audio(note.audioBase64);
          audioRef.current = a;
          a.onended = () => setActiveAudioId(null);
          a.play().catch(e => console.warn(e));
          setActiveAudioId(note.id);
        }
      };

      if (!isExpanded) {
        return (
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs overflow-hidden transition-all">
            <button
              type="button"
              onClick={() => setIsExpanded(true)}
              className="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-slate-50/80 dark:hover:bg-slate-800/40 cursor-pointer transition-colors"
            >
              <div className="flex items-center gap-2.5">
                <span className="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
                <span className="text-sm font-bold text-slate-800 dark:text-slate-200">
                  Not ve İstek Takibi · {pendingCount} bekleyen
                </span>
              </div>
              <div className="flex items-center gap-1.5 text-slate-400">
                <span className="text-[11px] font-medium hidden sm:inline">Genişlet</span>
                <IconChevronDown className="w-4 h-4 shrink-0" />
              </div>
            </button>
          </div>
        );
      }

      return (
        <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/90 dark:border-slate-800 p-4 sm:p-5 shadow-sm space-y-3.5">
          {/* Header */}
          <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-800 pb-3">
            <button
              type="button"
              onClick={() => setIsExpanded(false)}
              className="flex items-center gap-2 cursor-pointer group text-left"
            >
              <span className="text-base font-black text-slate-900 dark:text-white group-hover:text-sky-600 transition-colors">
                Not ve İstek Takibi
              </span>
              <span className="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300 font-bold text-xs">
                {pendingCount} Bekleyen
              </span>
              <IconChevronUp className="w-4 h-4 text-slate-400 group-hover:text-slate-600 ml-1 shrink-0" />
            </button>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={handleCopyAll}

    // --- NOTE ADD MODAL WITH 2-MIN AUDIO RECORDER ---
    function NoteAddModal({ isOpen, onClose, onSaveNote, sakas, initialNote, defaultCustomerId }) {
      const [targetMode, setTargetMode] = useState('all');
      const [selectedIds, setSelectedIds] = useState([]);
      const [type, setType] = useState('yapilacak');
      const [status, setStatus] = useState('bekliyor');
      const [text, setText] = useState('');
      const [audioBase64, setAudioBase64] = useState(undefined);
      const [audioDuration, setAudioDuration] = useState(undefined);

      // Recorder states
      const [isRecording, setIsRecording] = useState(false);
      const [recordSec, setRecordSec] = useState(0);
      const mediaRecorderRef = useRef(null);
      const chunksRef = useRef([]);
      const timerRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          if (initialNote) {
            setTargetMode(initialNote.targetType || 'all');
            setSelectedIds(initialNote.targetCustomerIds || []);
            setType(normalizeNoteType(initialNote.type || 'yapilacak'));
            setStatus(initialNote.status || 'bekliyor');
            setText(initialNote.text || '');
            setAudioBase64(initialNote.audioBase64);
            setAudioDuration(initialNote.audioDuration);
          } else {
            if (defaultCustomerId) {
              setTargetMode('single');
              setSelectedIds([defaultCustomerId]);
              setType('saka_istegi');
            } else {
              setTargetMode('all');
              setSelectedIds([]);
              setType('kendi_notum');
            }
            setStatus('bekliyor');
            setText('');
            setAudioBase64(undefined);
            setAudioDuration(undefined);
          }
        }
      }, [isOpen, initialNote, defaultCustomerId]);

      // Recording logic
      const startRecording = async () => {
        if (!navigator.mediaDevices?.getUserMedia) {
          alert('Tarayıcınız ses kaydını desteklemiyor.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          chunksRef.current = [];
          const rec = new MediaRecorder(stream);
          mediaRecorderRef.current = rec;

          rec.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
          rec.onstop = () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              setAudioBase64(reader.result);
              setAudioDuration(recordSec);
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(t => t.stop());
          };

          rec.start(250);
          setIsRecording(true);
          setRecordSec(0);

          let sec = 0;
          timerRef.current = setInterval(() => {
            sec++;
            setRecordSec(sec);
            if (sec >= 120) { // 2 minute limit
              stopRecording();
            }
          }, 1000);
        } catch (e) {
          alert('Mikrofon başlatılamadı. İzin verildiğinden emin olun.');
        }
      };

      const stopRecording = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
        setIsRecording(false);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!text.trim() && !audioBase64) {
          alert('Lütfen yazılı bir not girin veya ses kaydedin.');
          return;
        }
        const isSelfNote = targetMode === 'all';
        onSaveNote({
          id: initialNote?.id || 'note-' + Date.now(),
          date: initialNote?.date || toLocalDateString(new Date()),
          createdAt: initialNote?.createdAt || Date.now(),
          targetType: targetMode,
          targetCustomerIds: targetMode === 'all' ? [] : selectedIds,
          targetCustomerNames: targetMode === 'all' ? ['Benim Notum'] : selectedIds.map(cid => {
            const s = sakas.find(item => item.id === cid);
            return s ? (s.ownerName || 'Saka #' + s.sakaNo) : cid;
          }),
          project: 'Sucum Nerede',
          type: isSelfNote && (type === 'saka_istegi' || type === 'musteri_istegi') ? 'kendi_notum' : normalizeNoteType(type),
          text: text.trim(),
          status,
          audioBase64,
          audioDuration
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 overflow-y-auto">
          <div className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4 max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
              <h3 className="text-base font-bold text-slate-900 dark:text-white">
                {initialNote ? 'Notu Düzenle' : '+ Yeni Not / Sesli Not'}
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <IconX className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSave} className="space-y-3.5 text-xs">
              {/* Kime */}
              <div>
                <label className="block text-slate-700 dark:text-slate-300 font-bold mb-1">Kime Ait?</label>
                <div className="grid grid-cols-3 gap-1.5">
                  {[
                    { id: 'all', label: 'Benim Notum (Saka yok)' },
                    { id: 'single', label: 'Tek Saka' },
                    { id: 'multiple', label: 'Birkaç Saka' }
                  ].map(m => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => setTargetMode(m.id)}
                      className={`py-1.5 px-2 rounded-xl font-bold border transition-all cursor-pointer ${
                        targetMode === m.id
                          ? 'bg-sky-600 text-white border-sky-600'
                          : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                      }`}
                    >
                      {m.label}
                    </button>
                  ))}
                </div>

                {targetMode !== 'all' && (
                  <div className="mt-2 p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 max-h-32 overflow-y-auto space-y-1">
                    {sakas.map(s => {
                      const isSel = selectedIds.includes(s.id);
                      return (
                        <div
                          key={s.id}
                          onClick={() => {
                            if (targetMode === 'single') setSelectedIds([s.id]);
                            else setSelectedIds(prev => prev.includes(s.id) ? prev.filter(x => x !== s.id) : [...prev, s.id]);
                          }}
                          className={`p-1.5 rounded-lg flex items-center justify-between cursor-pointer ${
                            isSel ? 'bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-200 font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'
                          }`}
                        >
                          <span>#{s.sakaNo} {s.ownerName}</span>
                          {isSel && <IconCheck className="w-3.5 h-3.5 text-sky-600" />}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Tür, Durum */}
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-600 dark:text-slate-400 font-bold mb-1">Tür</label>
                  <select
                    value={type}
                    onChange={(e) => setType(e.target.value)}
                    className="w-full px-2 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                  >
                    <option value="yapilacak">Yapılacak</option>
                    <option value="yapilmayacak_dikkat">Yapılmayacak / Dikkat</option>
                    <option value="saka_istegi">Saka isteği / öneri</option>
                    <option value="kendi_notum">Kendi notum</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-600 dark:text-slate-400 font-bold mb-1">Durum</label>
                  <select
                    value={status}
                    onChange={(e) => setStatus(e.target.value)}
                    className="w-full px-2 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                  >
                    <option value="bekliyor">Bekliyor</option>
                    <option value="yapiliyor">Yapılıyor</option>
                    <option value="yapildi">Tamamlandı</option>
                    <option value="yapilmayacak">Yapılmayacak</option>
                  </select>
                </div>
              </div>

              {/* Yazılı Not */}
              <div>
                <label className="block text-slate-700 dark:text-slate-300 font-bold mb-1">Yazılı Not</label>
                <textarea
                  rows={2}
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="Not detayını yazın..."
                  className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                />
              </div>

              {/* Sesli Not (MediaRecorder) */}
              <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 space-y-2">
                <span className="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                  <IconMic className="w-4 h-4 text-sky-500" />
                  Sesli Not (Azami 2 Dakika)
                </span>

                {!audioBase64 ? (
                  <div className="flex items-center gap-2">
                    {!isRecording ? (
                      <button
                        type="button"
                        onClick={startRecording}
                        className="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center gap-1.5 cursor-pointer"
                      >
                        <IconMic className="w-3.5 h-3.5" />
                        <span>Ses Kaydet</span>
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={stopRecording}
                        className="px-3 py-1.5 rounded-xl bg-rose-600 text-white font-bold flex items-center gap-1.5 animate-pulse cursor-pointer"
                      >
                        <IconSquare className="w-3.5 h-3.5" />
                        <span>Kaydı Bitir ({Math.floor(recordSec / 60)}:{recordSec % 60 < 10 ? '0' : ''}{recordSec % 60})</span>
                      </button>
                    )}
                    <span className="text-[10px] text-slate-400">Yazı ya da ses bırakabilirsiniz</span>
                  </div>
                ) : (
                  <div className="flex items-center justify-between p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                    <span className="font-medium text-emerald-600 flex items-center gap-1">
                      <IconVolume className="w-4 h-4" />
                      Sesli Not Kaydedildi
                    </span>
                    <button
                      type="button"
                      onClick={() => setAudioBase64(undefined)}
                      className="text-rose-500 font-bold hover:underline cursor-pointer"
                    >
                      Sil
                    </button>
                  </div>
                )}
              </div>

              <div className="flex justify-end gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-slate-400 font-bold">Vazgeç</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-sky-600 text-white font-bold shadow-md shadow-sky-600/20">Kaydet</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- SAKA / MÜŞTERİ DETAIL MODAL ---
    function SakaDetailModal({ saka, projects, globalNotes, onClose, onSave, onDelete, onOpenAddNote, onStatusChangeNote, onDeleteGlobalNote, showToast }) {
      const [data, setData] = useState(() => {
        const d = JSON.parse(JSON.stringify(saka));
        if (!Array.isArray(d.ownerPhones) || d.ownerPhones.length === 0) {
          d.ownerPhones = d.ownerPhone ? [{ id: 'p-own-1', number: d.ownerPhone, label: 'Cep' }] : [];
        }
        if (!Array.isArray(d.drivers) || d.drivers.length === 0) {
          d.drivers = (d.driverName || d.credentials?.driverUsername) ? [{
            id: 'drv-1',
            name: d.driverName || '',
            role: 'asil',
            phones: d.driverPhone ? [{ id: 'p-drv-1', number: d.driverPhone, label: 'Cep' }] : [],
            username: d.credentials?.driverUsername || '',
            password: d.credentials?.driverPassword || ''
          }] : [];
        } else {
          d.drivers = d.drivers.map((drv, idx) => ({
            ...drv,
            role: drv.role || (idx === 0 ? 'asil' : 'yedek'),
            username: drv.username || (idx === 0 ? d.credentials?.driverUsername || '' : ''),
            password: drv.password || (idx === 0 ? d.credentials?.driverPassword || '' : '')
          }));
        }
        if (!Array.isArray(d.assistants) || d.assistants.length === 0) {
          d.assistants = d.employeeName ? [{ id: 'ast-1', name: d.employeeName, phones: d.employeePhone ? [{ id: 'p-ast-1', number: d.employeePhone, label: 'Cep' }] : [] }] : [];
        }
        return d;
      });

      const isSucum = !data.project || data.project === 'Sucum Nerede';
      const [activeTab, setActiveTab] = useState('kisiler');
      const [showPasswords, setShowPasswords] = useState({});
      const [deleteConfirm, setDeleteConfirm] = useState(false);
      const [confirmDeleteDriverId, setConfirmDeleteDriverId] = useState(null);
      const [confirmDeleteAssistantId, setConfirmDeleteAssistantId] = useState(null);
      const [newCustomSetup, setNewCustomSetup] = useState('');

      const PHONE_LABELS = ['Cep', 'İş', 'Ev', 'Eşi', 'Diğer'];

      const handleSubscriptionTypeChange = (type) => {
        const newEnd = calculateSubscriptionEndDate(data.subscription.startDate, type);
        setData(prev => ({ ...prev, subscription: { ...prev.subscription, type, endDate: newEnd } }));
      };

      const copyToClipboard = (text, label) => {
        if (!text) return;
        navigator.clipboard.writeText(text);
        showToast(`${label} panoya kopyalandı.`, 'success');
      };

      const togglePassword = (field) => {
        setShowPasswords(prev => ({ ...prev, [field]: !prev[field] }));
      };

      // Owner phone helpers
      const addOwnerPhone = () => {
        const newP = { id: 'p-' + Date.now(), number: '', label: 'Cep' };
        setData(prev => {
          const phones = [...(prev.ownerPhones || []), newP];
          return { ...prev, ownerPhones: phones, ownerPhone: phones[0]?.number || '' };
        });
      };
      const updateOwnerPhone = (id, field, val) => {
        setData(prev => {
          const phones = (prev.ownerPhones || []).map(p => p.id === id ? { ...p, [field]: val } : p);
          return { ...prev, ownerPhones: phones, ownerPhone: phones[0]?.number || '' };
        });
      };
      const deleteOwnerPhone = (id) => {
        setData(prev => {
          const phones = (prev.ownerPhones || []).filter(p => p.id !== id);
          return { ...prev, ownerPhones: phones, ownerPhone: phones[0]?.number || '' };
        });
      };

      // Driver helpers
      const addDriver = () => {
        const newD = {
          id: 'drv-' + Date.now(),
          name: '',
          role: (data.drivers && data.drivers.length > 0) ? 'yedek' : 'asil',
          phones: [{ id: 'p-' + Date.now(), number: '', label: 'Cep' }],
          username: '',
          password: ''
        };
        setData(prev => ({ ...prev, drivers: [...(prev.drivers || []), newD] }));
      };
      const updateDriver = (id, field, val) => {
        setData(prev => ({
          ...prev,
          drivers: (prev.drivers || []).map(d => d.id === id ? { ...d, [field]: val } : d)
        }));
      };
      const updateDriverRole = (id, role) => {
        setData(prev => ({
          ...prev,
          drivers: (prev.drivers || []).map(d => {
            if (d.id === id) return { ...d, role };
            if (role === 'asil') return { ...d, role: 'yedek' };
            return d;
          })
        }));
      };
      const updateDriverCredential = (id, field, val) => {
        setData(prev => ({
          ...prev,
          drivers: (prev.drivers || []).map(d => d.id === id ? { ...d, [field]: val } : d)
        }));
      };
      const deleteDriver = (id) => {
        setData(prev => ({ ...prev, drivers: (prev.drivers || []).filter(d => d.id !== id) }));
      };
      const addDriverPhone = (drvId) => {
        const newP = { id: 'p-' + Date.now(), number: '', label: 'Cep' };
        setData(prev => ({
          ...prev,
          drivers: (prev.drivers || []).map(d => d.id === drvId ? { ...d, phones: [...d.phones, newP] } : d)
        }));
      };
      const updateDriverPhone = (drvId, phoneId, field, val) => {
        setData(prev => ({
          ...prev,

    // --- TRANSACTION ADD FORM ---
    function TransactionAddForm({ onAdd }) {

      const [description, setDescription] = useState('');
      const [date, setDate] = useState(() => toLocalDateString(new Date()));

      const handleSubmit = (e) => {
        e.preventDefault();
        const amt = parseFloat(amount);
        if (!amt || amt <= 0 || !description.trim()) return;
        onAdd({
          id: 'tx-' + Date.now(),
          type,
          amount: amt,
          description: description.trim(),
          date,
          createdAt: Date.now()
        });
        setAmount('');
        setDescription('');
      };

      return (
        <form onSubmit={handleSubmit} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 space-y-2.5">

          <div className="grid grid-cols-3 gap-1.5">
            {[

              { id: 'masraf', label: 'Masraf Yaptım' },
              { id: 'tahsilat', label: 'Tahsil Ettim' }
            ].map(b => (

                type="button"
                onClick={() => setType(b.id)}
                className={`py-1.5 px-2 rounded-xl text-xs font-bold border transition-all cursor-pointer ${
                  type === b.id
                    ? b.id === 'ucret'
                      ? 'bg-sky-600 text-white border-sky-600'
                      : b.id === 'masraf'
                      ? 'bg-purple-600 text-white border-purple-600'
                      : 'bg-emerald-600 text-white border-emerald-600'
                    : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                }`}
              >
                {b.label}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-2 gap-2">
            <input
              type="number"
              placeholder="Tutar (TL)"

              onChange={(e) => setAmount(e.target.value)}

            <input

            <input

            >
              Ekle
            </button>
          </div>
        </form>
      );

        e.preventDefault();
        if (oldPin !== currentPin) {
          setPinError('Mevcut PIN hatalı!');
          return;
        }
        if (newPin.length !== 6) {
          setPinError('Yeni PIN 6 haneli olmalıdır.');
          return;
        }
        if (newPin !== confirmNewPin) {
          setPinError('Yeni PIN kodları eşleşmiyor.');
          return;
        }
        try {
          const newSalt = generateSalt();
          const newKey = await deriveKey(newPin, newSalt);
          const newVault = await encryptAppData(appData, newKey);
          saveStoredSalt(newSalt);
          saveStoredVault(newVault);
          onPinChange(newPin);
          setIsChangingPin(false);
          setOldPin('');
          setNewPin('');

          setPinError('PIN güncellenirken hata oluştu.');
