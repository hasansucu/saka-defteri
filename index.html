                      </p>
                      <ol className="list-decimal list-inside space-y-1 pl-1 text-[11px]">
                        <li><strong>console.cloud.google.com</strong> adresine Google hesabınızla girin.</li>
                        <li>Yukarıdan yeni bir proje açın (veya mevcut projenizi seçin).</li>
                        <li><strong>APIs &amp; Services &gt; Enabled APIs &amp; Services &gt; + Enable APIs</strong> kısmından <strong>Google Drive API</strong>&apos;yi aratıp etkinleştirin.</li>
                        <li><strong>OAuth Consent Screen</strong> sayfasına girip Kullanıcı Türünü <strong>External</strong> seçin. Uygulama adına <strong>Saka Defteri</strong> yazıp kaydedin.</li>
                        <li><strong>Credentials &gt; Create Credentials &gt; OAuth client ID</strong> tıklayın. Uygulama türünü <strong>Web application</strong> seçin.</li>
                        <li><strong>Authorized JavaScript origins</strong> alanına GitHub Pages adresinizi ekleyin (ör: <code>https://kullaniciadi.github.io</code>).</li>
                        <li>Kaydet&apos;e basın. GitHub Pages sayfanızda &quot;Google Drive&apos;a Bağlan&quot; butonuna basarak yetki verip eşitlemeyi kullanmaya başlayabilirsiniz.</li>
                      </ol>
                    </div>
                  )}
                </div>
              </div>

              {/* Backup & Restore with Size and Date */}
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-800 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-800 dark:text-slate-200">Yedekleme & Geri Yükleme</span>
                  <span className="text-[10px] text-slate-400 font-mono">Boyut: {formatBackupSize(appData.lastBackupSizeBytes)}</span>
                </div>

                <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs">
                  <span className="text-slate-500">Son Yedek: <strong className="text-slate-800 dark:text-slate-200">{formatDateTimeTr(appData.lastBackupDate)}</strong></span>
                  <span className="text-[10px] text-emerald-600 font-bold">Sesli Notlar Dahil</span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => { onQuickBackup(); onClose(); }}
                    className="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-sky-400 flex items-center gap-2 text-left cursor-pointer"
                  >
                    <IconDownload className="w-4 h-4 text-sky-500 shrink-0" />
                    <div>
                      <span className="text-xs font-bold block">Şifreli Yedek Al</span>
                      <span className="text-[10px] text-slate-400 block">İndir & Drive/WhatsApp Paylaş</span>
                    </div>
                  </button>
                  <button
                    onClick={() => { onTriggerRestore(); onClose(); }}
                    className="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-sky-400 flex items-center gap-2 text-left cursor-pointer"
                  >
                    <IconUpload className="w-4 h-4 text-amber-500 shrink-0" />
                    <div>
                      <span className="text-xs font-bold block">Yedekten Yükle</span>
                      <span className="text-[10px] text-slate-400 block">Dosyadan geri açar</span>
                    </div>
                  </button>
                </div>
              </div>

              {/* Sample Data Management */}
              <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-800 space-y-2">
                <span className="text-xs font-bold text-slate-800 dark:text-slate-200 block">Örnek Veri Yönetimi</span>
                <p className="text-[11px] text-slate-400">
                  Demo amaçlı kayıtlar.{sampleCount > 0 ? ` (Şu an ${sampleCount} örnek kayıt var)` : ' (Örnek kayıt yok)'}
                </p>
                <div className="flex gap-2 pt-1">
                  <button
                    onClick={onLoadSamples}
                    className="px-3 py-1.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl text-xs font-bold cursor-pointer"
                  >
                    Örnekleri Yükle
                  </button>
                  {sampleCount > 0 && (
                    <button
                      onClick={onDeleteSamples}
                      className="px-3 py-1.5 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-300 border border-rose-200 dark:border-rose-900 rounded-xl text-xs font-bold cursor-pointer"
                    >
                      Örnek Verileri Sil
                    </button>
                  )}
                </div>
              </div>

              {/* Wipe Data */}
              <div className="p-4 rounded-2xl bg-rose-50/50 dark:bg-rose-950/20 border border-rose-200 dark:border-rose-900 space-y-1">
                <span className="text-xs font-bold text-rose-700 dark:text-rose-300 block">Tüm Verileri Sıfırla</span>
                <p className="text-[11px] text-rose-600 dark:text-rose-400">Tüm müşterileri, ses kayıtlarını ve PIN kodunu kalıcı olarak siler.</p>
                <button
                  onClick={() => {
                    if (confirm('Tüm kayıtlarınız, sesleriniz ve PIN kodunuz silinecek. Emin misiniz?')) {
                      onWipeAll();
                    }
                  }}
                  className="px-3 py-1.5 bg-rose-600 text-white rounded-xl text-xs font-bold cursor-pointer mt-1"
                >
                  Sıfırla
                </button>
              </div>
            </div>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-900/80 flex justify-end">
              <button onClick={onClose} className="px-4 py-2 bg-slate-200 dark:bg-slate-800 rounded-xl text-xs font-bold">Kapat</button>
            </div>
          </div>
        </div>
      );
    }

    // React Error Boundary
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error: error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('React ErrorBoundary:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">
              <div className="max-w-lg w-full bg-rose-950/90 border-2 border-rose-500 rounded-3xl p-6 text-rose-100 space-y-4 shadow-2xl">
                <h2 className="text-lg font-black text-white flex items-center gap-2">
                  <span>⚠️ Uygulama Hatası</span>
                </h2>
                <p className="text-xs text-rose-200">
                  Uygulama çalışırken beklenmedik bir hata ile karşılaşıldı:
                </p>
                <pre className="bg-rose-900/60 p-3 rounded-xl border border-rose-800 text-[11px] font-mono whitespace-pre-wrap overflow-x-auto text-rose-200">
                  {String(this.state.error ? (this.state.error.stack || this.state.error.message || this.state.error) : 'Bilinmeyen hata')}
                </pre>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => window.location.reload()}
                    className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl cursor-pointer"
                  >
                    Sayfayı Yenile
                  </button>
                  <button
                    onClick={() => { localStorage.clear(); sessionStorage.clear(); window.location.reload(); }}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-300 text-xs font-bold rounded-xl cursor-pointer"
                  >
                    Önbelleği Sıfırla
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
